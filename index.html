<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <title>reCAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf"></script>
  <style>
    .grecaptcha-badge { visibility: hidden !important; }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 20px) + 1.5rem) 1.5rem calc(env(safe-area-inset-bottom, 20px) + 2rem);
    }
    .header {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #52525b;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }
    .score {
      font-size: clamp(6rem, 28vw, 8.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1rem;
      transition: color 0.25s ease, opacity 0.25s ease;
    }
    .good { color: #22c55e; }
    .warn { color: #f59e0b; }
    .bad  { color: #ef4444; }
    .dim  { color: #27272a; }
    .status {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #71717a;
      min-height: 1.2em;
    }
    .footer {
      width: 100%;
      max-width: 320px;
    }
    button {
      width: 100%;
      height: 52px;
      background-color: #18181b;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    button:active {
      transform: scale(0.98);
      background-color: #27272a;
      color: #fafafa;
    }
    button:disabled {
      opacity: 0.45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">reCAPTCHA v3</div>

  <div class="center">
    <div id="score" class="score dim">—</div>
    <div id="status" class="status">Checking</div>
  </div>

  <div class="footer">
    <button id="retest-btn" onclick="runCheck()">Re-test</button>
  </div>

  <script>
    const SITE_KEY = '6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf';
    const WEBHOOK_URL = 'https://n8n.klap.top/webhook/check-recaptcha';

    function runCheck() {
      const scoreEl = document.getElementById('score');
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('retest-btn');

      btn.disabled = true;
      scoreEl.textContent = '—';
      scoreEl.className = 'score dim';
      statusEl.textContent = 'Checking';

      if (typeof grecaptcha === 'undefined') {
        scoreEl.textContent = 'ERR';
        scoreEl.className = 'score bad';
        statusEl.textContent = 'Blocked';
        btn.disabled = false;
        return;
      }

      grecaptcha.ready(() => {
        grecaptcha.execute(SITE_KEY, { action: 'check' })
          .then(async (token) => {
            try {
              const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
              });
              const data = await res.json();

              if (data.success && typeof data.score === 'number') {
                scoreEl.textContent = data.score.toFixed(1);
                if (data.score >= 0.7) {
                  scoreEl.className = 'score good';
                  statusEl.textContent = 'Clean';
                } else if (data.score >= 0.5) {
                  scoreEl.className = 'score warn';
                  statusEl.textContent = 'Borderline';
                } else {
                  scoreEl.className = 'score bad';
                  statusEl.textContent = 'Flagged';
                }
              } else {
                scoreEl.textContent = 'ERR';
                scoreEl.className = 'score bad';
                statusEl.textContent = (data['error-codes'] && data['error-codes'][0]) || 'Failed';
              }
            } catch (err) {
              scoreEl.textContent = 'ERR';
              scoreEl.className = 'score bad';
              statusEl.textContent = 'Network Error';
            } finally {
              btn.disabled = false;
            }
          })
          .catch(() => {
            scoreEl.textContent = 'ERR';
            scoreEl.className = 'score bad';
            statusEl.textContent = 'Token Error';
            btn.disabled = false;
          });
      });
    }

    window.onload = runCheck;
  </script>
</body>
</html>
