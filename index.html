<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check reCAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf"></script>
  <style>
    .grecaptcha-badge { visibility: hidden !important; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .score {
      font-size: 6.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      transition: color 0.2s ease;
    }
    .good { color: #4caf50; }
    .warn { color: #ff9800; }
    .bad  { color: #f44336; }
    .dim  { color: #444; }
    .status {
      font-size: 0.9rem;
      color: #777;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    button {
      background: transparent;
      color: #666;
      border: 1px solid #262626;
      padding: 0.5rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      transition: all 0.15s ease;
    }
    button:hover {
      color: #ccc;
      border-color: #444;
    }
  </style>
</head>
<body>
  <div id="score" class="score dim">—</div>
  <div id="status" class="status">Checking</div>
  <button onclick="runCheck()">Re-test</button>

  <script>
    const SITE_KEY = '6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf';
    const WEBHOOK_URL = 'https://n8n.klap.top/webhook/check-recaptcha';

    function runCheck() {
      const scoreEl = document.getElementById('score');
      const statusEl = document.getElementById('status');

      scoreEl.textContent = '—';
      scoreEl.className = 'score dim';
      statusEl.textContent = 'Checking';

      if (typeof grecaptcha === 'undefined') {
        scoreEl.textContent = 'ERR';
        scoreEl.className = 'score bad';
        statusEl.textContent = 'Script blocked';
        return;
      }

      grecaptcha.ready(() => {
        grecaptcha.execute(SITE_KEY, { action: 'check' })
          .then(async (token) => {
            try {
              const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
              });
              const data = await res.json();

              if (data.success && typeof data.score === 'number') {
                scoreEl.textContent = data.score.toFixed(1);
                if (data.score >= 0.7) {
                  scoreEl.className = 'score good';
                  statusEl.textContent = 'Clean';
                } else if (data.score >= 0.5) {
                  scoreEl.className = 'score warn';
                  statusEl.textContent = 'Borderline';
                } else {
                  scoreEl.className = 'score bad';
                  statusEl.textContent = 'Flagged';
                }
              } else {
                scoreEl.textContent = 'ERR';
                scoreEl.className = 'score bad';
                statusEl.textContent = (data['error-codes'] && data['error-codes'][0]) || 'Invalid response';
              }
            } catch (err) {
              scoreEl.textContent = 'ERR';
              scoreEl.className = 'score bad';
              statusEl.textContent = err.message;
            }
          })
          .catch((err) => {
            scoreEl.textContent = 'ERR';
            scoreEl.className = 'score bad';
            statusEl.textContent = err.message || 'Token error';
          });
      });
    }

    window.onload = runCheck;
  </script>
</body>
</html>
