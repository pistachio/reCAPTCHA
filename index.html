<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check reCAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid #333;
      text-align: center;
      width: 340px;
    }
    .result {
      font-size: 3rem;
      font-weight: 700;
      margin: 1rem 0;
    }
    .good { color: #4caf50; }
    .bad  { color: #f44336; }
    button {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 1rem;
    }
    button:hover { background: #383838; }
    pre {
      text-align: left;
      background: #141414;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      overflow-x: auto;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div>reCAPTCHA v3 Token Check</div>
    <div id="result" class="result">...</div>
    <div id="status">Requesting token...</div>
    <button onclick="runCheck()">Re-test</button>
    <pre id="raw"></pre>
  </div>

  <script>
    const SITE_KEY = '6LcVhTUuAAAAAATKBSphqHhpSXb1-q-tZgDgmthf';

    function runCheck() {
      const resultEl = document.getElementById('result');
      const statusEl = document.getElementById('status');
      const rawEl = document.getElementById('raw');

      resultEl.textContent = '...';
      resultEl.className = 'result';
      statusEl.textContent = 'Requesting token...';
      rawEl.textContent = '';

      if (typeof grecaptcha === 'undefined') {
        resultEl.textContent = 'ERR';
        resultEl.classList.add('bad');
        statusEl.textContent = 'Google reCAPTCHA script blocked';
        return;
      }

      grecaptcha.ready(() => {
        grecaptcha.execute(SITE_KEY, { action: 'check' })
          .then((token) => {
            if (token && token.length > 20) {
              resultEl.textContent = 'PASS';
              resultEl.classList.add('good');
              statusEl.textContent = 'Token issued by Google';
              rawEl.textContent = 'Token prefix:\n' + token.slice(0, 60) + '...';
            } else {
              resultEl.textContent = 'FAIL';
              resultEl.classList.add('bad');
              statusEl.textContent = 'Empty token returned';
            }
          })
          .catch((err) => {
            resultEl.textContent = 'ERR';
            resultEl.classList.add('bad');
            statusEl.textContent = err.message || 'Execution failed';
          });
      });
    }

    window.onload = runCheck;
  </script>
</body>
</html>
